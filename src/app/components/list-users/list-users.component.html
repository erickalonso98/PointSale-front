<table class="table table-hover w-100 text-center mt-3">
    <thead>
      <tr>
          <th scope="row">#</th>
          <td colspan="2">Nombre</td>
          <td>Apellidos</td>
          <td>Correo</td>
          <td>Foto</td>
          <td>Fecha de Creacion</td>
          <td>Opciones</td>
      </tr>
    </thead>
    <tbody>
      @for(user of this.users; track user.id){
      <tr class="table-active">
        <th scope="row">{{ user.id }}</th>
        <td colspan="2" class="table-active">{{ user.name }}</td>
        <td>{{ user.lastname }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.photo }}</td>
        <td>{{ user.created_at }}</td>
        <td>
          <a href="" class="btn btn-warning"><i class="lni lni-book"></i></a> -
          <a href="" class="btn btn-info"><i class="lni lni-spinner-arrow"></i></a> -
          <a href="" class="btn btn-danger"><i class="lni lni-trash-can"></i></a>
        </td>
      </tr>
    }
    </tbody>
</table>
