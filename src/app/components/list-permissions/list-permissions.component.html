<table class="table table-hover w-100 text-center mt-3">
    <thead>
        <tr>
            <th scope="row">#</th>
            <td colspan="2">Nombre</td>
            <td>Fecha de creacion</td>
            <td>Opciones</td>
        </tr>
    </thead>
    <tbody>
        @for (permission of this.permissions; track permission.id) {
            <tr>
               <td>{{ permission.id }}</td>
               <td colspan="2">{{ permission.name }}</td>
               <td>{{ permission.created_at }}</td>
               <td>
                    <a routerLink="/permission-detail/{{ permission.id }}" routerLinkActive="active" class="btn btn-warning"><i class="lni lni-book"></i></a> -
                    <a routerLink="/update-permission-form/{{ permission.id }}" routerLinkActive="active" class="btn btn-info"><i class="lni lni-spinner-arrow"></i></a> - 
                    <a (click)="this.deletedPermission(permission.id)" routerLinkActive="active" class="btn btn-danger"><i class="lni lni-trash-can"></i></a>
               </td>
            </tr>
        }
    </tbody>
</table>
