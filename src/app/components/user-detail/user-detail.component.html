<div class="container-fluid">
    <div class="row nowrap">
        <div class="bg-dark col-auto col-md-4 col-lg-2 min-vh-100 d-flex flex-column justify-content-between">
            <app-sidebar/>
        </div>
        <div class="col px-4 mt-5">
            <div class="container mt-5 w-50">
                <div class="card text-center">
                    <div class="card-header">
                      Informacion
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">{{ this.title }}</h5>
                      <img alt="usuario" width="70px" height="70px" [src]="user.photo_url ? 'http://localhost:8000/storage/' + user.photo
      : 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
                      <p class="card-text">Num. Identificador:{{ this.user.id }}</p>
                      <p class="card-text">Nombre:{{ this.user.name }}</p>
                      <p class="card-text">Apellidos:{{ this.user.lastname }}</p>
                      <p class="card-text">Correo:{{ this.user.email }}</p>
                      <a routerLink="/users" routerLinkActive="active" class="btn btn-info">Regresar</a>
                    </div>
                    <div class="card-footer text-muted">
                      Creacion: {{ this.user.created_at }}
                    </div>
                  </div>
            </div>
        </div>      
    </div>
</div>
