<div class="container-fluid">
    <div class="row nowrap">
        <div class="bg-dark col-auto col-md-4 col-lg-2 min-vh-100 d-flex flex-column justify-content-between">
            <app-sidebar/>
        </div>
        <div class="col px-4 mt-5">
            <h1>Contenido Principal de formulario de Categorias</h1>
            <p>Este es el espacio para el contenido principal.</p>
            <div class="container mt-5 w-50">
                <div class="card card-body">
                    <h2 class="text-center text-uppercase">{{ this.title }}</h2>
                    <hr>
                    <form #formCategory="ngForm" (ngSubmit)="this.onSubmit(formCategory)">
                        <div class="form-group">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="name" #name="ngModel" [(ngModel)]="this.category.name" placeholder="Nombre" required="">
                            @if(!name.valid && name.touched){
                                <small class="text-danger">El nombre la categoria es requerida</small>
                            }
                        </div><br>
                        <div class="form-group">
                            <label for="description">Descripcion</label>
                            <textarea class="form-control" rows="8" #description="ngModel" [(ngModel)]="this.category.description" name="description" placeholder="Descripcion"></textarea>
                        </div>
                        <input type="submit" value="Registrar" class="btn btn-primary mt-3" [disabled]="formCategory.invalid">
                    </form>
                </div>
            </div> 
        </div>    
    </div>
</div>
