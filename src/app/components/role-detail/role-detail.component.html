<div class="container-fluid">
    <div class="row nowrap">
        <div class="bg-dark col-auto col-md-4 col-lg-2 min-vh-100 d-flex flex-column justify-content-between">
            <app-sidebar/>
        </div>
        <div class="col px-4 mt-5">
            <div class="container  mt-5 w-50">
                <div class="card text-center">
                    <div class="card-header">
                      Informacion
                    </div>
                    <div class="card-body">
                      <h5 class="card-title">{{ this.title }}</h5>
                      <p class="card-text">Num. Identificador:{{ this.role.id }}</p>
                      <p class="card-text">Rol:{{ this.role.name }}</p>
                      <a routerLink="/roles" routerLinkActive="active" class="btn btn-info">Regresar</a>
                    </div>
                    <div class="card-footer text-muted">
                      Creacion: {{ this.role.created_at }}
                    </div>
                  </div>
            </div>
        </div>      
    </div>
</div>
